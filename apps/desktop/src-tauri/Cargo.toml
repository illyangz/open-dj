[package]
name = "desktop"
version = "0.3.12"
description = "OpenDJ — a local-first DJ music preparation workspace"
authors = ["OpenDJ contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
sha2 = { workspace = true }
base64 = "0.22"

opendj-core = { path = "../../../crates/core" }
opendj-file-ops = { path = "../../../crates/file-ops" }
opendj-metadata = { path = "../../../crates/metadata" }
opendj-providers = { path = "../../../crates/providers" }
opendj-organization = { path = "../../../crates/organization" }
opendj-sync = { path = "../../../crates/sync" }
opendj-stems = { path = "../../../crates/stems" }
