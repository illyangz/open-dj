name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only for contents unless a workflow
# explicitly asks for write access — without this, tauri-action's build
# and signing succeed but the final "create the release" API call 403s
# with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # Deploys the Convex sync backend ahead of the desktop build so the app
  # gets built against a stable, already-live deployment rather than racing
  # a backend deploy against the client baking a URL in. Runs once (not
  # per-matrix-OS below) since a Convex deploy has no OS-specific step.
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: backend
        run: npm install
      # CONVEX_DEPLOY_KEY is a repo secret (Convex dashboard → Settings →
      # Deploy Keys), scoped only to this step, matching how
      # TAURI_SIGNING_PRIVATE_KEY below is scoped only to the signing step
      # that needs it.
      - working-directory: backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

  build:
    needs: deploy-backend
    # Pin, not "latest" — reproducible builds (two runs of the same tag
    # should produce the same bundled tool), and makes yt-dlp's known
    # staleness-over-time (it needs frequent updates to track YouTube's
    # anti-bot changes) an explicit, visible, single-line bump rather than a
    # silently moving target. Bump periodically; see
    # https://github.com/yt-dlp/yt-dlp/releases for the latest tag.
    env:
      YTDLP_VERSION: "2026.08.19"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only, not a universal (arm64+x86_64) binary: `ort`
          # (pulled in by `opendj-stems` for on-device stem separation) only
          # ships prebuilt ONNX Runtime binaries for aarch64-apple-darwin —
          # there's no prebuilt x86_64-apple-darwin binary, so the Intel
          # half of a universal build fails outright at link time. Building
          # arm64-only sidesteps that; the trade-off is dropping support for
          # Intel Macs (pre-November 2020) entirely, not just stems on them.
          #
          # `--config src-tauri/tauri.release.conf.json` merges in `bundle.externalBin`
          # for ffmpeg/yt-dlp (staged into src-tauri/binaries/ by the steps
          # below) — kept out of the base tauri.conf.json deliberately:
          # `tauri_build::build()` validates that every externalBin path
          # actually exists *at compile time*, unconditionally, even for a
          # plain `cargo check` — putting it in the base config would break
          # local dev for anyone who hasn't fetched ~150MB of binaries first.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json"
          - platform: ubuntu-latest
            args: "--config src-tauri/tauri.release.conf.json"
          - platform: windows-latest
            args: "--config src-tauri/tauri.release.conf.json"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Isolated bridge dylib for real libkeyfinder-based key detection —
      # macOS only, built and dropped into src-tauri/resources/ before
      # `tauri build` runs (see scripts/build-keyfinder-bridge.sh and
      # crates/keyfinder-bridge/src/lib.rs for why it's kept out of the
      # main app's own dependency graph). On Linux/Windows this step is
      # skipped entirely and the app falls back to stratum-dsp for key
      # detection, same as any Mac without libkeyfinder installed.
      - name: Build keyfinder bridge (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install libkeyfinder pkgconf
          bash scripts/build-keyfinder-bridge.sh

      # Bundled so users never need `brew install ffmpeg yt-dlp` themselves
      # — see crates/providers/src/yt_dlp_bin.rs's `find_in_bundle()`, which
      # already checks the app bundle's Resources dir first (that discovery
      # code needed no changes for this; it was already bundle-aware). Both
      # binaries land in apps/desktop/src-tauri/binaries/, named with the
      # Rust target-triple suffix Tauri's `externalBin` expects to find at
      # build time (see tauri.conf.json's bundle.externalBin), and get
      # stripped back to plain `ffmpeg`/`yt-dlp` when copied into the final
      # bundle. OpenDJ itself is GPL-3.0-or-later, so a GPL-flavored ffmpeg
      # build (full codec set, e.g. libx264) is license-compatible — no
      # need to hunt for an LGPL-only build. yt-dlp is Unlicense (public
      # domain), no compliance concern either way.
      # evermeet.cx (the "usual" macOS static-ffmpeg source) explicitly does
      # not build for Apple Silicon — its binary is x86_64-only and would
      # only run on this arm64-only build via Rosetta, if installed at all.
      # osxexperts.net's arm-native build was verified (2026-08-21) to link
      # only against macOS system frameworks (/System/Library/..., /usr/lib)
      # — no Homebrew or other third-party dylib paths — confirmed via
      # `otool -L`, so it's genuinely self-contained on any Mac, unlike a
      # `brew install ffmpeg` binary (which dynamically links dozens of
      # Homebrew-path dylibs that don't exist on a user's machine at all).
      - name: Stage ffmpeg + yt-dlp (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euxo pipefail
          mkdir -p apps/desktop/src-tauri/binaries
          curl -L -o /tmp/ffmpeg.zip https://www.osxexperts.net/ffmpeg9arm.zip
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
          cp /tmp/ffmpeg-extract/ffmpeg apps/desktop/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x apps/desktop/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          curl -L -o apps/desktop/src-tauri/binaries/yt-dlp-aarch64-apple-darwin \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_macos"
          chmod +x apps/desktop/src-tauri/binaries/yt-dlp-aarch64-apple-darwin

      - name: Stage ffmpeg + yt-dlp (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -euxo pipefail
          mkdir -p apps/desktop/src-tauri/binaries
          mkdir -p /tmp/ffmpeg-dl && cd /tmp/ffmpeg-dl
          # -O (not -o) keeps johnvansickle's own filenames — the .md5
          # sidecar's checksum line references that exact original name, so
          # renaming the download breaks `md5sum -c`'s own file lookup.
          curl -LO https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          curl -LO https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz.md5
          md5sum -c ffmpeg-release-amd64-static.tar.xz.md5
          tar -xf ffmpeg-release-amd64-static.tar.xz
          cd -
          cp /tmp/ffmpeg-dl/ffmpeg-*-amd64-static/ffmpeg apps/desktop/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          curl -L -o apps/desktop/src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux"
          chmod +x apps/desktop/src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu

      - name: Stage ffmpeg + yt-dlp (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $ffmpegExe = Get-ChildItem -Recurse -Path ffmpeg-extract -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName apps/desktop/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YTDLP_VERSION/yt-dlp.exe" `
            -OutFile apps/desktop/src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe

      # TAURI_SIGNING_PRIVATE_KEY (and, if the key was generated with a
      # password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD) must be set as repo
      # secrets — see apps/desktop/src-tauri/tauri.conf.json's
      # plugins.updater.pubkey for the matching public half. Without the
      # private key present, tauri-action still builds installers but
      # skips signing, and the updater plugin refuses unsigned updates.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Not a secret — it's a deployment URL, not a credential (the
          # actual credential is CONVEX_DEPLOY_KEY, used only in
          # deploy-backend above). Set as a repo *variable* (Settings →
          # Secrets and variables → Actions → Variables) from the Convex
          # dashboard's Settings → URL & Deploy Key page. Baked into the
          # binary at compile time via `option_env!("CONVEX_URL")` in
          # `apps/desktop/src-tauri/src/state.rs`; falls back to a local
          # `npx convex dev` URL when unset, so plain `cargo tauri dev`
          # needs no configuration at all.
          CONVEX_URL: ${{ vars.CONVEX_URL }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDJ ${{ github.ref_name }}"
          # Live (not draft/prerelease) so the updater's `.../releases/
          # latest/download/latest.json` endpoint resolves to it — GitHub's
          # "latest" release lookup skips both draft and prerelease
          # releases, which would otherwise leave installed apps unable to
          # find new versions.
          releaseDraft: false
          prerelease: false

      # Tauri's own installer filenames embed the version
      # (OpenDJ_0.3.4_aarch64.dmg), so a version-agnostic link like
      # .../releases/latest/download/OpenDJ-macOS.dmg would 404 the moment
      # the next release ships under a different filename. Uploading an
      # extra, identically-named-every-release copy alongside the real
      # installer means the marketing site's download buttons can be plain
      # static links (see site/index.html) — no client-side GitHub API call,
      # no rate-limit risk, no landing on the releases page to hunt for the
      # right file.
      # Round-trips through the release itself (download the just-uploaded
      # versioned asset by pattern, re-upload under the stable name) rather
      # than hunting for the file on the runner's local filesystem — the
      # exact local bundle output path is an implementation detail of the
      # tauri-action version in use and not worth depending on, whereas "an
      # asset matching *.dmg exists on this release" is exactly what the
      # previous step already guarantees.
      - name: Upload stable-named download link (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "*.dmg" --output OpenDJ-macOS.dmg --clobber
          gh release upload "${{ github.ref_name }}" OpenDJ-macOS.dmg --clobber --repo "${{ github.repository }}"

      - name: Upload stable-named download link (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "*.exe" --output OpenDJ-Windows.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "${{ github.ref_name }}" OpenDJ-Windows.exe --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload stable-named download link (Linux)
        if: matrix.platform == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "*.AppImage" --output OpenDJ-Linux.AppImage --clobber
          gh release upload "${{ github.ref_name }}" OpenDJ-Linux.AppImage --clobber --repo "${{ github.repository }}"
