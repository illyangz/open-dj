name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      # crates/keyfinder-bridge hard-links libkeyfinder (via libkeyfinder-sys)
      # on purpose — it's an isolated cdylib loaded at runtime with
      # libloading so the *main app* never hard-depends on it (see that
      # crate's lib.rs). Only macOS runners install libkeyfinder here; on
      # Linux/Windows the crate is excluded from workspace-wide commands
      # below and the app just falls back to stratum-dsp for key detection,
      # same as any end-user machine without libkeyfinder installed.
      - name: Install libkeyfinder (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libkeyfinder pkgconf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: clippy (macOS, full workspace)
        if: matrix.os == 'macos-latest'
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (excluding keyfinder-bridge)
        if: matrix.os != 'macos-latest'
        run: cargo clippy --workspace --exclude opendj-keyfinder-bridge --all-targets -- -D warnings
      - name: test (macOS, full workspace)
        if: matrix.os == 'macos-latest'
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
        run: cargo test --workspace
      - name: test (excluding keyfinder-bridge)
        if: matrix.os != 'macos-latest'
        run: cargo test --workspace --exclude opendj-keyfinder-bridge

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
